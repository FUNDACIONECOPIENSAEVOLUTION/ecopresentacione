name: Publicar Atlas Ecopiensa en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'identidad-corporativa.css'
      - 'organigrama-interactivo.js'
      - 'PLAN-AMPLIACION-PRODUCTOS.md'
      - 'imagenes/modelos/**'
      - 'imagenes/organigramas/**'
      - 'identidad/**'
      - '*.png'
      - 'README.md'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Verificar archivos
        run: |
          test -s index.html
          node -e "const s=require('fs').readFileSync('index.html','utf8');const js=s.match(/<script>([\s\S]*?)<\/script>/);if(!js)process.exit(1);new Function(js[1]);"
      - name: Verificar organigrama, galería y referencias
        run: |
          node --check organigrama-interactivo.js
          test -s identidad/logo-fundacion-oficial.png
          test -s imagenes/organigramas/organigrama-base-subproductos.jpg
          test -s imagenes/organigramas/ruta-paquetes-modelos.jpg
          for grupo in 09-bloques 10-mobiliario 11-drenajes 12-vias; do
            test "$(find "imagenes/modelos/paquete-$grupo" -maxdepth 1 -name '*.jpg' | wc -l)" -eq 10
          done
          test "$(find imagenes/modelos/paquete-13-morteros -maxdepth 1 -name '*.jpg' | wc -l)" -eq 3
          test "$(find imagenes/modelos/paquete-14-viviendas -maxdepth 1 -name '*.jpg' | wc -l)" -eq 3
          test "$(find imagenes/modelos/paquete-15-detalles -maxdepth 1 -name '*.jpg' | wc -l)" -eq 10
          test "$(find imagenes/modelos/paquete-16-paisajismo -maxdepth 1 -name '*.jpg' | wc -l)" -eq 10
          test -s galeria-completa.html
          test "$(find imagenes/disenos/macetas-led -maxdepth 1 -name '*.jpg' | wc -l)" -eq 12
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const script=fs.readFileSync('organigrama-interactivo.js','utf8');
          for(const q of ['id="organigrama"','id="treeRoot"','id="treeProducts"','id="treeUses"','id="modelosGrid"','id="modelosFiltros"','id="roadmapGrid"'])if(!h.includes(q))throw Error('Elemento faltante '+q);
          const first=script.slice(script.indexOf('const atlasModels = ['),script.indexOf('];\natlasModels.forEach'));
          const initial=[...first.matchAll(/file:'([^']+)'/g)].map(x=>x[1]);
          const additions=[...script.matchAll(/\{pack:(10|11|12|13|14|15|16),file:'([^']+)'/g)].map(x=>({pack:Number(x[1]),file:x[2]}));
          if(initial.length!==10 || additions.length!==56)throw Error('Modelos esperados 66: iniciales '+initial.length+', extras '+additions.length);
          for(const file of initial)if(!fs.existsSync('imagenes/modelos/paquete-09-bloques/'+file+'.jpg'))throw Error('Bloque sin imagen '+file);
          const dir={10:'mobiliario',11:'drenajes',12:'vias',13:'morteros',14:'viviendas',15:'detalles',16:'paisajismo'};
          for(const m of additions){
            const path='imagenes/modelos/paquete-'+m.pack+'-'+dir[m.pack]+'/'+m.file+'.jpg';
            if(!fs.existsSync(path))throw Error('Modelo sin imagen: '+path);
          }
          const catalog=h.slice(h.indexOf('const appPhotos={'),h.indexOf('function appVisual(a)'));
          const apps=[...catalog.matchAll(/^'([^']+)':\{file:'([^']+)'(?:,pack:(\d+))?/gm)];
          if(apps.length!==51)throw Error('Esperadas 51 aplicaciones con imagen, hay '+apps.length);
          for(const [,label,file,pack] of apps){
            const path='imagenes/aplicaciones/paquete-'+String(pack||3).padStart(2,'0')+'/'+file+'.jpg';
            if(!fs.existsSync(path))throw Error(label+': '+path);
          }

          const led=h.slice(h.indexOf('const ledDesigns=['),h.indexOf('function renderLedDesigns()'));
          const ledNames=[...led.matchAll(/file:'([^']+)'/g)].map(m=>m[1]);
          if(ledNames.length!==12||new Set(ledNames).size!==12)throw Error('Faltan diseños LED');
          for(const file of ledNames)if(!fs.existsSync('imagenes/disenos/macetas-led/'+file+'.jpg'))throw Error('LED faltante '+file);
          const mats=h.slice(h.indexOf('const materials=['),h.indexOf('const defs=['));
          const names=[...mats.matchAll(/\{id:'([^']+)'/g)].map(m=>m[1]);
          if(names.length!==20)throw Error('No hay 20 materiales');
          const firstPack=new Set(['t1','t2','t3','t4','an','ag','af','pl','mi','bs']);
          for(const id of names){
            const filename='imagenes/materiales/paquete-'+(firstPack.has(id)?'01':'02')+'/'+id+'.jpg';
            if(!fs.existsSync(filename))throw Error('Falta foto de material '+filename);
          }
          const gallery=fs.readFileSync('galeria-completa.html','utf8');
          const invMatch=gallery.match(/const inventory=(\[[\s\S]*?\]);\nconst groups=/);
          if(!invMatch)throw Error('Inventario de galería inexistente');
          const inventory=JSON.parse(invMatch[1]);
          if(inventory.length!==149 || new Set(inventory.map(x=>x.path)).size!==149)throw Error('Inventario de imágenes incompleto');
          for(const item of inventory){if(!fs.existsSync(item.path)||fs.statSync(item.path).size<10000)throw Error('Imagen faltante o vacía '+item.path);}
          console.log('OK: 20 materiales, 51 aplicaciones, 66 modelos, 12 LED y 149 imágenes catalogadas');
          NODE
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
