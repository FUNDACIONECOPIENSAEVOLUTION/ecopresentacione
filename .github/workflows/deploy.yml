name: Publicar Atlas Ecopiensa en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '*.png'
      - 'README.md'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Verificar archivos
        run: |
          test -s index.html
          node -e "const s=require('fs').readFileSync('index.html','utf8');const js=s.match(/<script>([\s\S]*?)<\/script>/);if(!js)process.exit(1);new Function(js[1]);"
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
